<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduBot | Confirm Delete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center">
        <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-triangle-exclamation text-red-600 text-3xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Delete User?</h1>
        <p class="text-slate-500 mb-2">
            You are about to permanently delete the account:
        </p>
        <p class="text-lg font-semibold text-red-600 mb-6">{{ target_user.username }}</p>
        <p class="text-sm text-slate-400 mb-8">
            This action cannot be undone. All data associated with this account will be permanently removed.
        </p>
        <div class="flex gap-3">
            <a href="{% url 'adminpanel:user_list' %}"
               class="flex-1 py-3 border border-slate-200 text-slate-700 rounded-xl font-medium hover:bg-slate-50 transition-colors">
                <i class="fas fa-times mr-2"></i>Cancel
            </a>
            <form method="post" class="flex-1">
                {% csrf_token %}
                <button type="submit"
                    class="w-full py-3 bg-red-600 text-white rounded-xl font-medium hover:bg-red-700 transition-colors">
                    <i class="fas fa-trash mr-2"></i>Yes, Delete
                </button>
            </form>
        </div>
    </div>
</body>
</html>
