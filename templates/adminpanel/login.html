<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduBot | Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .input-field {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: white;
            border-radius: 12px;
            padding: 0.875rem 1rem 0.875rem 3rem;
            width: 100%;
            transition: all 0.3s;
        }
        .input-field::placeholder { color: #64748b; }
        .input-field:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .input-wrapper { position: relative; }
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6366f1;
        }
        .admin-btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            animation: pulse 4s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.6; transform: scale(1.1); }
        }
        .error-alert {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.4);
            color: #fca5a5;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .floating { animation: floating 6s ease-in-out infinite; }
        @keyframes floating {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">

    <!-- Ambient orbs -->
    <div class="orb w-96 h-96 bg-indigo-600 top-[-5rem] left-[-5rem] opacity-30" style="position:fixed;"></div>
    <div class="orb w-80 h-80 bg-purple-700 bottom-[-5rem] right-[-5rem] opacity-30" style="position:fixed; animation-delay:2s;"></div>

    <div class="relative z-10 w-full max-w-md">

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 shadow-2xl mb-5 floating">
                <i class="fas fa-shield-halved text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Admin Portal</h1>
            <p class="text-slate-400">Restricted access — authorised personnel only</p>
        </div>

        <!-- Card -->
        <div class="glass-card rounded-2xl p-8">

            {% if error_message %}
            <div class="error-alert mb-6">
                <i class="fas fa-exclamation-circle flex-shrink-0"></i>
                <span>{{ error_message }}</span>
            </div>
            {% endif %}

            <form method="post" action="" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Admin Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" name="username" placeholder="Enter admin username"
                               class="input-field" autocomplete="username" required
                               {% if form.username.value %}value="{{ form.username.value }}"{% endif %}>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" name="password" placeholder="Enter admin password"
                               class="input-field" autocomplete="current-password" required>
                    </div>
                </div>

                <button type="submit" class="admin-btn mt-2">
                    <i class="fas fa-right-to-bracket mr-2"></i>Access Admin Panel
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-700 flex items-center justify-between text-sm">
                <a href="{% url 'core:home' %}" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fas fa-arrow-left mr-1"></i>Back to Home
                </a>
                <a href="{% url 'accounts:login' %}" class="text-indigo-400 hover:text-indigo-300 transition-colors">
                    User Login <i class="fas fa-arrow-right ml-1"></i>
                </a>
            </div>
        </div>

        <p class="text-center text-slate-600 text-xs mt-6">
            &copy; 2025 EduBot. All rights reserved.
        </p>
    </div>

</body>
</html>
